name: Deploy landing to dev

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Build in CI, upload the built artifact only -- no composer/npm needed
      # on the server, mirrors birge-be's pattern. Allowlist, not a
      # blacklist: dist/ gets only the dirs Laravel actually needs at
      # runtime, so any new dev-only file added to the repo root (configs,
      # docs, tooling) is excluded by default instead of needing a matching
      # --exclude added here. composer.json IS needed at runtime (not just
      # by composer) -- Application::getNamespace() reads it directly on
      # every Blade component-tag compile; removing it 500s the whole app.
      # storage/{framework,logs,app/public} are server-owned runtime state
      # that must survive redeploys untouched (framework cache/session/view
      # cache, logs, uploaded media).
      - name: Build deploy payload
        run: |
          set -euo pipefail
          mkdir -p dist
          rsync -a \
            --exclude='/storage/framework/***' \
            --exclude='/storage/logs/***' \
            --exclude='/storage/app/public/***' \
            --include='/artisan' \
            --include='/composer.json' \
            --include='/app/' --include='/app/**' \
            --include='/bootstrap/' --include='/bootstrap/**' \
            --include='/config/' --include='/config/**' \
            --include='/database/' --include='/database/**' \
            --include='/lang/' --include='/lang/**' \
            --include='/public/' --include='/public/**' \
            --include='/resources/' --include='/resources/**' \
            --include='/routes/' --include='/routes/**' \
            --include='/storage/' --include='/storage/**' \
            --include='/vendor/' --include='/vendor/**' \
            --exclude='*' \
            . dist/

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LANDING_DEV_SFTP_KEY }}

      # wlixcc/SFTP-Deploy-Action uploads file-by-file and is too slow for
      # vendor/ (thousands of small files, Filament pulls in a lot). lftp
      # over the same SFTP-only chrooted account supports parallel
      # transfers -- same approach as birge-fe's deploy pipelines. No
      # --delete: .env, uploaded media (storage/app/public/media), and the
      # public/storage symlink must survive every redeploy untouched.
      # --no-perms skips the extra per-file/per-dir chmod round-trip (the
      # next step re-applies the perms PHP-FPM actually needs anyway).
      - name: Upload the build over SFTP
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set sftp:connect-program 'ssh -a -x -o StrictHostKeyChecking=accept-new -p ${{ secrets.LANDING_DEV_SFTP_PORT }}';
            set mirror:parallel-transfer-count 30;
            set net:max-retries 2;
            set net:timeout 20;
            open -u ${{ secrets.LANDING_DEV_SFTP_USERNAME }},x sftp://${{ secrets.LANDING_DEV_SFTP_HOST }};
            mirror -R --parallel=30 --no-perms --verbose dist/ /www/;
          "

      # PHP-FPM runs as a different system user than the SFTP deploy account.
      # New directories land with the server's default umask, so PHP-FPM
      # can't create its own runtime cache dirs under storage/framework/ or
      # bootstrap/cache/ unless we re-apply group-write + setgid here after
      # each deploy. Walking every directory in the payload with `find` was
      # hundreds of round-trips over SFTP and dominated deploy time -- only
      # the fixed set of dirs PHP-FPM actually writes to need this.
      - name: Fix directory permissions for PHP-FPM cache writes
        env:
          SFTP_KEY: ${{ secrets.LANDING_DEV_SFTP_KEY }}
        run: |
          set -euo pipefail
          key_file="$(mktemp)"
          batch_file="$(mktemp)"
          printf '%s\n' "$SFTP_KEY" > "$key_file"
          chmod 600 "$key_file"
          for dir in \
            bootstrap/cache \
            storage \
            storage/app \
            storage/app/public \
            storage/framework \
            storage/framework/cache \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs \
          ; do
            echo "chmod 2775 /www/$dir" >> "$batch_file"
          done
          sftp -i "$key_file" -P ${{ secrets.LANDING_DEV_SFTP_PORT }} \
            -o StrictHostKeyChecking=accept-new \
            -b "$batch_file" ${{ secrets.LANDING_DEV_SFTP_USERNAME }}@${{ secrets.LANDING_DEV_SFTP_HOST }}
          rm -f "$key_file" "$batch_file"

      # Deploy user is SFTP-only/chrooted (no shell) -- artisan commands
      # can't run from this pipeline. After a deploy that changes migrations
      # or config, an admin runs by hand over `ssh birgeteam.com`:
      #   cd /var/www/birge-landing-dev/www
      #   php artisan migrate --force
      #   php artisan config:cache
      # See birge-ops/provision-new-stand/new-landing-stand.md.
